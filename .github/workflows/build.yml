name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore VideoPlayer.csproj

      - name: Publish
        run: dotnet publish VideoPlayer.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Create ZIP
        run: Compress-Archive -Path publish\* -DestinationPath VideoPlayer-Windows.zip

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: VideoPlayer-Windows
          path: VideoPlayer-Windows.zip
