name: Build Video Player

on:
  workflow_dispatch:

jobs:

  build:

    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build EXE
        run: >
          dotnet publish
          -c Release
          -r win-x64
          --self-contained true
          -o publish

      - name: ZIP
        run: |
          Compress-Archive `
            -Path publish\* `
            -DestinationPath VideoPlayer.zip

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: VideoPlayer-Windows
          path: VideoPlayer.zip
